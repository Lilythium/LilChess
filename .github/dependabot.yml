# Weekly update pull requests. See docs/mobile-release-checklist.md section 4 for what to do with each one.
# Not covered: Swift Package Manager (the iOS package file is generated by `cap sync`), checked by hand.
version: 2
updates:
  # npm workspaces share the root lockfile, so one entry covers server, shared, web and mobile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # These must move together: core, native platforms, official plugins and the secure-storage plugin.
      capacitor:
        patterns:
          - "@capacitor/*"
          - "capacitor-secure-storage-plugin"
      dev-tooling:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/js"
          - "vitest"
          - "@types/*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Android Gradle plugin and AndroidX libraries.
  - package-ecosystem: gradle
    directory: "/mobile/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      android:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
